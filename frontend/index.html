    <main id="dashboardEl" class="dashboard">

      <div class="hero-section">
        <!-- Stock Title & Price Hero -->
        <div class="glass-panel stock-ident">
          <div class="ident-content">
            <div id="heroSymbol" class="stock-symbol-display"></div>
            <h1 id="heroName" class="stock-name-display"></h1>
            <div id="heroSector" class="stock-sector"></div>
            
            <div class="hero-price-wrap">
              <div id="heroPrice" class="hero-price"></div>
              <div id="heroChange" class="hero-change"></div>
            </div>
          </div>
        </div>

        <!-- Main Price Chart -->
        <div class="glass-panel chart-card">
          <div class="chart-container">
            <canvas id="mainChart"></canvas>
          </div>
        </div>
      </div>

      <!-- Top Metrics (Volume, Cap, Day Range, etc) -->
      <div id="metricsBar" class="metrics-bar">
        <!-- Injected via JS -->
      </div>

      <!-- Detail Grids -->
      <div class="sub-grids">
        
        <!-- Technical Indicators -->
        <div class="glass-panel bento-box">
          <h2 class="section-title">Technical Radar</h2>
          <div class="signals-grid">
            <div id="rsiCard" class="indicator-card"></div>
            <div id="macdCard" class="indicator-card"></div>
            <div id="signalCard" class="indicator-card"></div>
          </div>
          <div id="techDataGrid" class="data-grid"></div>
        </div>

        <!-- Support & Resistance (Pivot Points) -->
        <div class="glass-panel bento-box" id="pivotBox">
          <h2 class="section-title">Key Levels (Daily Pivots)</h2>
          <div id="pivotGrid" class="data-grid">
            <!-- Injected via JS -->
          </div>
        </div>

        <!-- Relative Strength -->
        <div class="glass-panel bento-box" id="rsBox">
          <h2 class="section-title">Relative Strength (%)</h2>
          <div id="rsGrid" class="data-grid">
            <!-- Injected via JS -->
          </div>
        </div>

        <!-- Options Chain Highlights -->
        <div class="glass-panel bento-box" id="optionsBox">
          <h2 class="section-title">Options Chain (Max OI)</h2>
          <div id="optionsGrid" class="data-grid">
            <!-- Injected via JS -->
          </div>
        </div>

        <!-- Financial Statements Overview -->
        <div class="glass-panel bento-box" id="financialsBox">
          <h2 class="section-title">Financials (TTM)</h2>
          <div id="financialsGrid" class="data-grid">
            <!-- Injected via JS -->
          </div>
        </div>

        <!-- Fundamentals -->
        <div class="glass-panel bento-box" id="fundamentalsBox">
          <h2 class="section-title">Fundamentals & Valuations</h2>
          <div id="fundGrid" class="data-grid">
            <!-- Injected via JS -->
          </div>
        </div>
        
      </div>

      <!-- Performance Section -->
      <div class="glass-panel bento-box">
        <h2 class="section-title">Historical Performance Returns</h2>
        <div id="perfGrid" class="perf-grid">
          <!-- Injected via JS -->
        </div>
      </div>
